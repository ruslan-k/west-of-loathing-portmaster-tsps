name: Native ARM64 probe
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python3 -m pip install lz4 capstone UnityPy
      - name: Current Unity package and bounded-run contracts
        run: python3 -m unittest -v test_unity_port test_bounded_run
      - name: Validate data-free overlay syntax
        run: |
          git apply --numstat runtime/wol-adapter.patch
          git apply --numstat runtime/unity/legacy-fmod-output.patch
      - name: Read-only memory profiler and staged selection tests
        run: |
          python3 -m unittest discover -s tools -p 'test_wol_memory*.py' -v
          PYTHONPATH=tools python3 -m unittest -v test_wol_m4_wave2 test_wol_sprite_metadata test_wol_map_pixel_space test_wol_frame_parity
      - name: Install cross compiler and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: Build with warnings as errors
        run: bash build.sh
      - name: Run data-free ARM64 trap and IPC tests
        run: python3 -m unittest -v test_native test_preflight test_prepare test_horizon_prepare
